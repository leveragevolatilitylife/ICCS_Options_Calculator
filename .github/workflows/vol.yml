name: Update volatility data
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vol-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_vol.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vol.json
          git diff --cached --quiet || (git commit -m "Update volatility data" && git pull --rebase -q && git push)
